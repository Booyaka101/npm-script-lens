name: reusable-release
on:
  workflow_call: {}
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm publish
