name: shared-publish
on:
  workflow_call: {}
permissions:
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm publish
