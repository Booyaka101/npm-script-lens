name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per branch. A second push supersedes the first instead of queueing
# behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 20.18, not a floating 20: require(esm) landed in 20.19, and a Node
        # that has it loads ESM-only dependencies the declared floor cannot.
        node: ['20.18', 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test

      # The VS Code extension has its own suite and its own package.json, so the
      # root `npm test` never reached it, 25 tests that only ever ran locally.
      # It has no dependencies of its own (core.js deliberately does not import
      # `vscode`), so it needs no install step.
      - name: VS Code extension tests
        working-directory: editors/vscode
        run: npm test
