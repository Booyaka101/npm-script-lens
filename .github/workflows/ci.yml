name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per branch. A second push supersedes the first instead of queueing
# behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 18 is the declared floor and has no require(esm), so it is also the
        # leg that catches an ESM-only dependency slipping back in. 20.18 keeps
        # a pre-20.19 mid-range. Node 20.0.x is deliberately absent: the CLI
        # runs there, but its test runner does not fire root before() hooks, so
        # the suite cannot start its own mock registry.
        node: ['18', '20.18', 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test

      # The VS Code extension has its own suite and its own package.json, so the
      # root `npm test` never reached it, 25 tests that only ever ran locally.
      # It has no dependencies of its own (core.js deliberately does not import
      # `vscode`), so it needs no install step.
      - name: VS Code extension tests
        working-directory: editors/vscode
        run: npm test
