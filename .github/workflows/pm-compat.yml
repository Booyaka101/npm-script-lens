# Cross-ecosystem writer canary: for each package manager, generate a real
# lockfile, run `allow --write`, and confirm the manager then RUNS an approved
# package's install script — i.e. our native allowlist output is still valid
# for that manager. Mirrors the flow verified locally during development. A red
# leg means a manager changed its allowlist format and pm-contract needs a patch.
name: pm-compat
on:
  schedule:
    - cron: '37 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  writer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pm: [npm, pnpm, bun]
    name: ${{ matrix.pm }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install tool dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install ${{ matrix.pm }}
        run: |
          case "${{ matrix.pm }}" in
            pnpm) npm install -g pnpm ;;
            bun)  npm install -g bun ;;
            # the runner's bundled npm is v11, where install scripts still run
            # by DEFAULT — the allowlist would never be consulted and the leg
            # would pass without testing anything. v12 is where allowScripts is
            # enforced, so that is the only version this canary is meaningful on.
            npm)  npm install -g npm@12 ;;
          esac
      - name: Scaffold a project with a scripted dependency (core-js)
        run: |
          mkdir -p /tmp/pmc && cd /tmp/pmc
          echo '{ "name": "pmc", "version": "1.0.0", "dependencies": { "core-js": "3.38.1" } }' > package.json
      - name: Generate the lockfile
        working-directory: /tmp/pmc
        run: |
          case "${{ matrix.pm }}" in
            npm)  npm install --package-lock-only --ignore-scripts --no-audit --no-fund ;;
            pnpm) pnpm install --lockfile-only ;;
            bun)  bun install --ignore-scripts || bun install ;;
          esac
      # The ground truth is the MANAGER'S OWN blocked-scripts signal, observed
      # both before and after `allow --write`. Earlier revisions grepped for
      # core-js's funding banner, which cannot work: core-js suppresses it
      # whenever CI is set (GitHub always sets it), npm hides lifecycle stdout
      # without --foreground-scripts, and bun never echoes postinstall output at
      # all — so the bun leg was passing only because the loose pattern matched
      # bun's own "+ core-js@3.38.1" package line. Asserting on the manager's
      # signal removes every third-party dependency, and checking the BEFORE
      # state proves the assertion is not vacuous.
      - name: Verify the manager blocks the script, then honors our allowlist
        working-directory: /tmp/pmc
        run: |
          set -e
          case "${{ matrix.pm }}" in
            # npm 11.18/12 renamed the warning prefix from `allow-scripts` to
            # `install-scripts` (the new `npm install-scripts approve|deny|ls|
            # prune` front-end; `approve-scripts` lives on as an alias). Match
            # either so this works on both lines.
            npm)  BLOCKED='(allow|install)-scripts' ;;
            pnpm) BLOCKED='gnored build script' ;;   # Ignored build scripts: core-js
            # bun reports "Blocked N postinstall" only on the install that first
            # discovers them, so a re-install is silent and the probe would look
            # unblocked. `bun pm untrusted` is the stateless query bun's own
            # message points at, so ask that instead of scraping install output.
            bun)  BLOCKED='core-js' ;;
          esac
          probe() {
            rm -rf node_modules
            case "${{ matrix.pm }}" in
              npm)  npm install --no-audit --no-fund 2>&1 || true ;;
              pnpm) pnpm install 2>&1 || true ;;
              bun)  bun install >/dev/null 2>&1 || true; bun pm untrusted 2>&1 || true ;;
            esac
          }

          echo "── BEFORE allow --write ─────────────────────────"
          before=$(probe); echo "$before"
          if echo "$before" | grep -Eqi "$BLOCKED"; then
            baseline=blocked
          else
            baseline=unblocked
            echo "::warning::${{ matrix.pm }} did not block the install script by default — this leg cannot prove the allowlist did anything"
          fi

          echo "── allow --write ────────────────────────────────"
          node "$GITHUB_WORKSPACE/src/cli.js" allow --path /tmp/pmc --no-trust --write

          echo "── AFTER allow --write ──────────────────────────"
          after=$(probe); echo "$after"
          if echo "$after" | grep -Eqi "$BLOCKED"; then
            echo "::error::${{ matrix.pm }}: still reports blocked install scripts after allow --write — our native allowlist format has drifted"
            exit 1
          fi
          [ "$baseline" = blocked ] \
            && echo "✅ ${{ matrix.pm }}: blocked before, allowed after — allowlist format is still valid" \
            || echo "⚠️ ${{ matrix.pm }}: nothing was blocked to begin with (inconclusive, not a failure)"
