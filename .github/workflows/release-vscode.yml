name: Release (VS Code)

# Publishes editors/vscode to the VS Code Marketplace on the same v*.*.* tag
# that publishes the npm package, so one tag ships both halves of a release.
#
# Until now the extension was published by hand with `vsce publish` from a
# maintainer's machine, which needs a marketplace token sitting on that machine.
# release.yml refuses to do that for npm, on the grounds that a token in CI is
# the credential an account takeover reuses; the same argument applies here.
#
# AUTH, in order of preference:
#
#   1. Microsoft Entra ID over GitHub OIDC (`vsce publish --azure-credential`).
#      Nothing stored, nothing to rotate. Microsoft's own guidance: "We
#      recommend that extension publishing use Microsoft Entra ID-based
#      authentication with workload identity federation and managed
#      identities."
#
#      One-time setup, in this order:
#
#        a. Azure portal, Managed Identities, create a user-assigned identity.
#        b. On it: Settings > Federated credentials > "GitHub Actions deploying
#           Azure resources". Entity type **Environment**, environment name
#           `marketplace-publish`. That entity type is why the job below
#           declares `environment:` at all: it puts
#           `repo:Booyaka101/npm-script-lens:environment:marketplace-publish`
#           in the OIDC subject, and the credential only matches if the job
#           actually runs in that environment.
#        c. Get the Azure DevOps profile id for that identity. This is the step
#           people get wrong, because the id the Marketplace wants is NOT the
#           client id and is not shown in the portal:
#
#             az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
#               --resource 499b84ac-1321-427f-aa17-267ca6975798
#
#           (run it while signed in AS the identity) and take the `id` field.
#        d. marketplace.visualstudio.com/manage > the `booyaka101` publisher >
#           add that id as a member with the Contributor role.
#        e. Set repo variables AZURE_CLIENT_ID and AZURE_TENANT_ID from the
#           identity's Properties blade.
#
#      This leg has never run: there is no identity yet, so the first tag after
#      setup is its first exercise.
#
#   2. A VSCE_PAT secret. The documented CI path today, and a stopgap.
#      Azure DevOps decommissions GLOBAL personal access tokens on 2026-12-01
#      (organization-scoped ones keep working), and marketplace publishing is
#      exactly the "all accessible organizations" shape being retired. If you
#      use this leg, scope the token to one organization.
#
# With neither configured the job explains itself and exits 0. The npm package
# has already published by the time this runs, so failing here would put a red
# X on a release that genuinely shipped, and a red X people learn to ignore is
# worse than no check at all.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # The federated credential is scoped to this environment, so the job has to
    # run in it or the OIDC subject will not match. It is also the place to hang
    # required reviewers if you ever want a human gate on a publish, which is
    # the thing `npm-script-lens publish --require-gate` exists to ask for.
    environment: marketplace-publish
    permissions:
      contents: read
      id-token: write # the OIDC leg; unused by the PAT leg
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # The extension has no dependencies of its own, so there is nothing to
      # install and nothing to restore from a cache into a publishing job.
      - name: Extension tests
        run: npm test

      # test/commands.test.js already asserts the extension version equals the
      # CLI's. This asserts both equal the tag, which is the thing that decides
      # what actually reaches the gallery.
      - name: The tag, the CLI and the extension must agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          EXT=$(node -p "require('./package.json').version")
          CLI=$(node -p "require('../../package.json').version")
          echo "tag=$TAG extension=$EXT cli=$CLI"
          [ "$TAG" = "$EXT" ] || { echo "::error::tag $TAG does not match extension $EXT"; exit 1; }
          [ "$TAG" = "$CLI" ] || { echo "::error::tag $TAG does not match CLI $CLI"; exit 1; }

      # Hits the public gallery API. vsce reports DONE and exits 0 even when the
      # publisher is not set up and the extension never appears, which is why
      # this exists at all (see the comment at the top of the script).
      - name: Publish preflight
        run: node scripts/preflight.mjs

      - name: Package
        run: npx --yes @vscode/vsce@3.9.2 package --out extension.vsix

      - name: Which auth is configured
        id: auth
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          HAS_PAT: ${{ secrets.VSCE_PAT != '' }}
        run: |
          if [ -n "${AZURE_CLIENT_ID:-}" ]; then echo "mode=entra" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_PAT" = "true" ]; then echo "mode=pat" >> "$GITHUB_OUTPUT"
          else echo "mode=none" >> "$GITHUB_OUTPUT"; fi

      - name: Sign in to Entra ID
        if: steps.auth.outputs.mode == 'entra'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # --skip-duplicate so a re-run, or a tag pushed twice, is a no-op instead
      # of a failure. The marketplace has no unpublish-and-retry for a version.
      - name: Publish (Entra ID, no stored secret)
        if: steps.auth.outputs.mode == 'entra'
        run: npx --yes @vscode/vsce@3.9.2 publish --packagePath extension.vsix --skip-duplicate --azure-credential

      - name: Publish (VSCE_PAT)
        if: steps.auth.outputs.mode == 'pat'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce@3.9.2 publish --packagePath extension.vsix --skip-duplicate

      - name: Not configured yet
        if: steps.auth.outputs.mode == 'none'
        run: |
          {
            echo "## VS Code extension not published"
            echo
            echo "The .vsix built and every gate passed, but no marketplace credential is configured, so nothing was uploaded."
            echo
            echo "### Preferred: Entra ID, nothing stored"
            echo
            echo "1. Azure portal > Managed Identities > create a user-assigned identity."
            echo "2. On it: Federated credentials > \"GitHub Actions deploying Azure resources\". Entity type **Environment**, name \`marketplace-publish\` (this job already runs in that environment, and the credential only matches if it does)."
            echo "3. Signed in as that identity, get the id the Marketplace wants. It is **not** the client id and the portal does not show it:"
            echo
            echo '   ```'
            echo "   az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me \\"
            echo "     --resource 499b84ac-1321-427f-aa17-267ca6975798"
            echo '   ```'
            echo
            echo "4. marketplace.visualstudio.com/manage > \`booyaka101\` > add that id as a member, Contributor role."
            echo "5. Set repo variables \`AZURE_CLIENT_ID\` and \`AZURE_TENANT_ID\`."
            echo
            echo "### Stopgap: a PAT"
            echo
            echo "Add a \`VSCE_PAT\` secret, scoped to one organization. Azure DevOps decommissions **global** PATs on 2026-12-01; organization-scoped ones keep working."
            echo
            echo "Then re-run this workflow. The .vsix built by this run is attached to it."
          } >> "$GITHUB_STEP_SUMMARY"

      # So a maintainer can install or upload the exact artifact the gates
      # passed on, rather than rebuilding it somewhere else.
      - uses: actions/upload-artifact@v4
        with:
          name: npm-script-lens-vsix
          path: editors/vscode/extension.vsix
          if-no-files-found: error
