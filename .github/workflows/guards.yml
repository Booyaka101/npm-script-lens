name: Guards

# Our own tools, run against this repo. If they are worth shipping they are worth
# depending on ourselves — a guard that never runs on our code is untested.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Our own tool. Locks the runner image's tool versions and diffs them when
      # GitHub bumps the image — including when a floating label like
      # ubuntu-latest silently re-points. Report-only; no fail-on yet.
      - name: Runner image drift
        uses: Booyaka101/runner-drift@v1
        with:
          fail-on-retirement: 60

      - name: pnpm v11 CI guard
        uses: Booyaka101/pnpm11-ci-guard@v1
        with:
          mode: warn

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Install-script audit
        run: node src/cli.js audit --path .

      # Version cooldown, run from source: npm worms are typically identified
      # within hours, so refuse to be among the first to install a new version.
      - name: Dependency cooldown
        run: node src/cli.js audit --path . --cooldown

      # Reports without gating, like the other guards — but a BREAKING finding
      # still shows as a failed step rather than being swallowed by '|| true'.
      - name: MCP spec readiness (2026-07-28)
        continue-on-error: true
        run: npx --yes @booyaka/mcp-vet@latest .

      # Drift gate: fails if a dependency gains an install script that nobody has
      # approved. The allowlist is only worth having if it is enforced.
      - name: Allowlist drift
        continue-on-error: true
        run: npx --yes npm-script-lens@latest sync --path . --check
