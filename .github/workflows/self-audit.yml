# Dogfood: audit this repo's own lockfile with the action from this repo.
name: self-audit
on:
  pull_request:
permissions:
  pull-requests: write
jobs:
  lens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          path: package-lock.json
          fail-on-high: 'true'
          comment-on-pr: 'true'
          manifest-check: 'true'
          trust-policy-check: 'true'
          # The new 1.16.0 input, exercised on this repo's own PRs. A gate with
          # no run history is not a gate you can trust.
          cooldown-check: 'true'
