# npm-compat canary: does this build still understand real npm? Drives the
# ACTUAL npm (not the stub npms the unit tests use) across a matrix of npm
# versions, so an upstream change to `npm install --dry-run --json` — the shape
# `review`/`doctor` depend on — turns this workflow red. The unit tests can't
# catch that; only a live-npm run can.
name: npm-compat
on:
  # weekly, so drift surfaces on its own timeline, plus on demand
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canary:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # '12' pins the supported major; 'latest'/'next-12' catch drift early. A
        # red leg means either shape drift OR npm bumped its node engine — the
        # logs say which.
        # NOT 'next': npm publishes no bare `next` dist-tag (its prerelease tags
        # are per-major — next-11, next-12, …), so `npm i -g npm@next` fails
        # ETARGET every single run. Any tag here is resolved before use below,
        # so a tag npm renames or drops skips the leg instead of reddening it.
        npm: ['12', 'latest', 'next-12']
    name: npm@${{ matrix.npm }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install tool dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install npm@${{ matrix.npm }}
        id: install-npm
        run: |
          if npm view "npm@${{ matrix.npm }}" version >/dev/null 2>&1; then
            npm install -g "npm@${{ matrix.npm }}"
          else
            # A dist-tag this canary watches no longer exists. That is npm
            # moving its release tags, not our tool drifting — say so and skip
            # rather than fail, so a real drift signal stays visible.
            echo "::notice::npm dist-tag '${{ matrix.npm }}' does not resolve — skipping this leg"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Report npm version
        if: steps.install-npm.outputs.skipped != 'true'
        run: npm --version
      - name: Run compatibility canary
        if: steps.install-npm.outputs.skipped != 'true'
        run: node scripts/npm-compat-canary.js
