version: 2

# Staying current is a standing requirement, so it is automated rather than
# remembered.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # Minor and patch only. Majors deliberately arrive as their own PR so one
      # breaking upgrade cannot redden, and block, a batch of safe ones.
      all-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # commander 15 needs Node >=22.12.0 and is ESM-only; this CLI is CommonJS
      # and advertises engines.node ">=18". Adopting it is a deliberate major
      # for this package (raise the floor AND convert to ESM), not a bump, and
      # test/engines.test.js fails the PR every time. Revisit when we choose to
      # do that; until then the weekly PR is pure noise.
      - dependency-name: commander
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(ci)'
    groups:
      # Minor and patch only. Majors deliberately arrive as their own PR so one
      # breaking upgrade cannot redden, and block, a batch of safe ones.
      actions-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

