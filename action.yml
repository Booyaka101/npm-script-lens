name: npm-script-lens
description: >-
  Audit npm install scripts for risky behavior (exec, network, fs,
  obfuscation) and suggest an npm v12 allowScripts block.
branding:
  icon: search
  color: red
inputs:
  path:
    description: >-
      Project directory or lockfile path (package-lock.json,
      npm-shrinkwrap.json, yarn.lock, or pnpm-lock.yaml)
    default: '.'
  fail-on-high:
    description: Fail the job (exit 1) when any package scores HIGH risk
    default: 'true'
  comment-on-pr:
    description: Post the audit report as a comment on pull requests
    default: 'true'
  sarif-file:
    description: >-
      If set, write a SARIF 2.1.0 file here (upload it with
      github/codeql-action/upload-sarif to get code scanning alerts)
    default: ''
  diff-base:
    description: >-
      If set, audit only packages added or upgraded relative to this base
      lockfile (e.g. one extracted from the PR base branch)
    default: ''
  trust:
    description: >-
      Enrich risky packages with OSV known-malicious advisories, publish age,
      weekly downloads, and provenance ('false' to disable)
    default: 'true'
  deep:
    description: >-
      Also analyze lockfile packages that install scripts require() by bare
      name ('true' to enable)
    default: 'false'
  manifest-check:
    description: >-
      Fail the job when the committed behavior manifest is out of date
      ('true' to enable)
    default: 'false'
  manifest-file:
    description: Manifest filename, resolved next to the lockfile
    default: script-lens.json
  check-v12-gaps:
    description: >-
      Check for npm v12 approve-scripts bugs: optional deps with install
      scripts missing from allowScripts (npm/cli#9562) and EGLOBAL-prone
      global installs in workflows (npm/cli#9463). 'auto' runs when the
      runner's npm is v12+; 'true'/'false' force.
    default: 'auto'
  ci-check:
    description: >-
      Fail the job (exit 1) when npm v12 would silently disable dependency
      install scripts: a workflow runs npm install, package.json has no
      allowScripts block, and the runner's npm is v12+. Runs no scan.
      'true' to enable (opt-in).
    default: 'false'
  sources-check:
    description: >-
      Fail the job (exit 1) when the lockfile contains git or remote-URL
      dependencies and the committed .npmrc allow-git/allow-remote is
      insufficient, over-permissive, or invalid — npm v12 refuses to resolve
      uncovered git/remote deps by default. 'true' to enable (opt-in).
    default: 'false'
  publish-check:
    description: >-
      Fail the job (exit 1) when a CI publish step still authenticates with a
      long-lived npm token (NODE_AUTH_TOKEN/NPM_TOKEN or an .npmrc _authToken
      write, with no id-token grant) — bypass-2FA tokens lose direct publish
      around January 2027; trusted (OIDC) and staged publishing survive — or
      when a trusted-publishing path is BROKEN by actions/setup-node older
      than v7 writing a dummy _authToken via registry-url.
      'true' to enable (opt-in).
    default: 'false'
  hooks-check:
    description: >-
      Fail the job (exit 1) when the working tree carries a HIGH open-time
      execution entry — a .vscode/tasks.json task with runOn folderOpen or an
      auto-firing .claude/settings.json command hook (SessionStart / Setup /
      InstructionsLoaded) — code that runs when the folder is opened, with no
      install step involved. 'true' to enable (opt-in).
    default: 'false'
  sync-check:
    description: >-
      Fail the job (exit 1) when the install-script allowlist has drifted from
      the lockfile (a new scripted dependency isn't covered, or a stale entry
      lingers). Works for npm, pnpm, yarn, and bun — auto-detected. 'true' to
      enable (opt-in).
    default: 'false'
  github-token:
    description: Token used to post the PR comment
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Install npm-script-lens dependencies
      shell: bash
      run: npm install --omit=dev --ignore-scripts --no-audit --no-fund --prefix "$GITHUB_ACTION_PATH"
    - name: Audit lifecycle scripts
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FAIL_ON_HIGH: ${{ inputs.fail-on-high }}
        INPUT_COMMENT_ON_PR: ${{ inputs.comment-on-pr }}
        INPUT_SARIF_FILE: ${{ inputs.sarif-file }}
        INPUT_DIFF_BASE: ${{ inputs.diff-base }}
        INPUT_TRUST: ${{ inputs.trust }}
        INPUT_DEEP: ${{ inputs.deep }}
        INPUT_MANIFEST_CHECK: ${{ inputs.manifest-check }}
        INPUT_MANIFEST_FILE: ${{ inputs.manifest-file }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: node "$GITHUB_ACTION_PATH/src/action.js"
    - name: Check npm v12 approve-scripts gaps
      # runs even when the audit step failed the job on fail-on-high
      if: ${{ always() && inputs.check-v12-gaps != 'false' }}
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_CHECK_V12_GAPS: ${{ inputs.check-v12-gaps }}
        INPUT_SARIF_FILE: ${{ inputs.sarif-file }}
      run: |
        mode="${INPUT_CHECK_V12_GAPS:-auto}"
        major="$(npm --version 2>/dev/null | cut -d. -f1)"
        case "$major" in (''|*[!0-9]*) major=0;; esac
        if [ "$mode" = "true" ] || { [ "$mode" = "auto" ] && [ "$major" -ge 12 ]; }; then
          node "$GITHUB_ACTION_PATH/src/action.js" v12-gaps
        else
          echo "Skipping npm v12 approve-scripts gap checks (npm major version $major, mode $mode)"
        fi
    - name: Check npm v12 allowScripts CI break
      # opt-in fail-fast gate; runs even when the audit step failed the job
      if: ${{ always() && inputs.ci-check == 'true' }}
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
      run: node "$GITHUB_ACTION_PATH/src/action.js" ci-check
    - name: Check npm v12 git/remote dependency config
      # opt-in gate: git/remote deps vs the committed allow-git/allow-remote
      if: ${{ always() && inputs.sources-check == 'true' }}
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
      run: node "$GITHUB_ACTION_PATH/src/action.js" sources-check
    - name: Check the release workflow survives the npm token cliff
      # opt-in gate: publish paths that still rely on a long-lived token
      if: ${{ always() && inputs.publish-check == 'true' }}
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_SARIF_FILE: ${{ inputs.sarif-file }}
      run: node "$GITHUB_ACTION_PATH/src/action.js" publish-check
    - name: Check for open-time execution entries
      # opt-in gate: folderOpen tasks and auto-firing Claude Code hooks
      if: ${{ always() && inputs.hooks-check == 'true' }}
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_SARIF_FILE: ${{ inputs.sarif-file }}
      run: node "$GITHUB_ACTION_PATH/src/action.js" hooks-check
    - name: Check the install-script allowlist is in sync
      # opt-in cross-ecosystem drift gate (npm/pnpm/yarn/bun, auto-detected)
      if: ${{ always() && inputs.sync-check == 'true' }}
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
      run: |
        if ! node "$GITHUB_ACTION_PATH/src/cli.js" sync --check --path "${INPUT_PATH:-.}"; then
          echo "::error::install-script allowlist is out of sync with the lockfile — run 'npx npm-script-lens sync --write' and commit the result"
          exit 1
        fi
